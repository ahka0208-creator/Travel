<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✈️ 沉浸式外幣記帳本</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.5);
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            padding: 20px 15px 10px 15px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        .header h2 { margin: 0; font-size: 22px; color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }
        
        .setting-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.8;
            transition: transform 0.2s;
        }
        .setting-btn:active { transform: rotate(45deg); }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 10px 20px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 水球動畫 */
        .water-tank-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0 30px 0;
        }
        .water-tank {
            width: 180px; height: 180px;
            background-color: #1e293b; border-radius: 50%;
            border: 4px solid #334155; position: relative; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
        }
        .water {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 100%; 
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            transition: height 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.5s;
            z-index: 1;
        }
        .water::before, .water::after {
            content: ''; position: absolute; width: 400px; height: 400px;
            top: -380px; left: 50%; margin-left: -200px;
            background: var(--bg-dark); border-radius: 40%;
            animation: spin 6s linear infinite; z-index: 2;
        }
        .water::after {
            background: rgba(15, 23, 42, 0.6); border-radius: 45%;
            animation: spin 8s linear infinite; z-index: 3;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .tank-text { position: absolute; z-index: 10; text-align: center; width: 100%; }
        .tank-label { font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 2px; }
        .tank-amount { font-size: 26px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .tank-currency { font-size: 14px; opacity: 0.9; }

        /* 輸入卡片 */
        .input-card {
            background: var(--bg-card); border-radius: 16px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .input-row { display: flex; gap: 10px; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #334155;
            padding: 12px 15px; border-radius: 8px; color: #fff;
            font-size: 16px; outline: none; transition: border 0.3s;
            box-sizing: border-box; appearance: none;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        /* 針對 select 的下拉箭頭 */
        select { background-image: url('data:image/svg+xml;utf8,<svg fill="%2394a3b8" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
                 background-repeat: no-repeat; background-position-x: 95%; background-position-y: 50%; }

        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: #000; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); margin-top: 20px; font-size: 14px;}

        /* 歷史記錄清單 */
        .history-section { flex: 1; display: flex; flex-direction: column; }
        .history-title { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 5px;}
        .history-list {
            flex: 1; overflow-y: auto; max-height: 250px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .history-list::-webkit-scrollbar { display: none; }
        .history-item {
            background: rgba(255,255,255,0.03); padding: 12px 15px;
            border-radius: 8px; display: flex; align-items: center; gap: 10px;
        }
        .history-info { flex: 1; display: flex; flex-direction: column; }
        .history-desc { font-size: 15px; font-weight: bold; color: #e2e8f0; }
        .history-time { font-size: 11px; color: #64748b; margin-top: 3px; }
        .history-amounts { text-align: right; }
        .history-foreign { font-size: 16px; font-weight: bold; color: #fff; }
        .history-hkd { font-size: 12px; color: var(--danger); margin-top: 2px; }
        .delete-btn {
            background: rgba(239, 68, 68, 0.15); border: none; border-radius: 6px;
            color: var(--danger); font-size: 14px; padding: 8px 10px; cursor: pointer; transition: background 0.2s;
        }
        .delete-btn:active { background: rgba(239, 68, 68, 0.4); }

        #setupView { display: none; width: 100%; max-width: 400px; margin: auto; padding: 20px;}
        #mainView { display: none; width: 100%; flex: 1; flex-direction: column;}
        
        .refresh-text {
            float: right; color: var(--primary); font-size: 12px; cursor: pointer;
        }
        .hint-text { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    </style>
</head>
<body>

    <!-- 1. 設定介面 -->
    <div id="setupView">
        <div class="header">
            <h2 id="setupTitle">🛫 新建旅行預算</h2>
            <p>設定總預算並獲取最新匯率</p>
        </div>
        <div class="input-card" style="margin-top: 20px;">
            <div class="input-group">
                <label>總預算 (HKD 港幣)</label>
                <input type="number" id="setupBudget" placeholder="例如：10000">
            </div>
            
            <div class="input-group">
                <label>選擇外幣 (自動獲取即時匯率)</label>
                <select id="setupCurrency" onchange="fetchLiveRate()">
                    <option value="JPY">🇯🇵 日圓 (JPY)</option>
                    <option value="TWD">🇹🇼 新台幣 (TWD)</option>
                    <option value="CNY">🇨🇳 人民幣 (CNY)</option>
                    <option value="KRW">🇰🇷 韓圜 (KRW)</option>
                    <option value="THB">🇹🇭 泰銖 (THB)</option>
                    <option value="EUR">🇪🇺 歐元 (EUR)</option>
                    <option value="GBP">🇬🇧 英鎊 (GBP)</option>
                    <option value="USD">🇺🇸 美元 (USD)</option>
                    <option value="AUD">🇦🇺 澳元 (AUD)</option>
                    <option value="SGD">🇸🇬 新加坡元 (SGD)</option>
                    <option value="OTHER">🔍 自訂其他外幣...</option>
                </select>
                <!-- 自訂外幣輸入框 (隱藏狀態) -->
                <input type="text" id="customCurrency" placeholder="請輸入 3 位英文字母 (如: VND)" style="display:none; margin-top:10px;" onchange="fetchLiveRate()">
            </div>

            <div class="input-group">
                <label>
                    兌換匯率 (1 外幣 = ? HKD) 
                    <span class="refresh-text" id="fetchStatus" onclick="fetchLiveRate()">🔄 重新抓取</span>
                </label>
                <input type="number" id="setupRate" placeholder="例如：0.052" step="0.0001">
                <div class="hint-text">*已顯示最新網上匯率，你可手動改為你唱錢的真實匯率。</div>
            </div>
            <button class="btn btn-primary" style="margin-top: 10px;" onclick="saveSetup()">儲存並出發！🚀</button>
        </div>
    </div>

    <!-- 2. 主要記帳介面 -->
    <div id="mainView">
        <div class="header">
            <button class="setting-btn" onclick="editSetup()" title="修改設定">⚙️</button>
            <h2 id="tripTitle">旅行記帳本</h2>
            <p>設定匯率: 1 <span id="displayCurr">JPY</span> = <span id="displayRate">0.052</span> HKD</p>
        </div>

        <div class="container">
            <!-- 水球視覺 -->
            <div class="water-tank-wrapper">
                <div class="water-tank">
                    <div class="water" id="waterLevel"></div>
                    <div class="tank-text">
                        <div class="tank-label">剩餘預算</div>
                        <div class="tank-amount">HK$ <span id="remainingHKD">0</span></div>
                        <div class="tank-currency" id="budgetPercentage">100%</div>
                    </div>
                </div>
            </div>

            <!-- 記帳輸入區 -->
            <div class="input-card">
                <div class="input-row">
                    <div style="flex: 1;">
                        <label>消費項目 (選填)</label>
                        <input type="text" id="expenseDesc" placeholder="例如：食拉麵">
                    </div>
                    <div style="flex: 1;">
                        <label>金額 (<span id="inputCurrLabel">JPY</span>)</label>
                        <input type="number" id="expenseAmount" placeholder="0">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addExpense()">💸 記低呢筆數</button>
            </div>

            <!-- 歷史記錄區 -->
            <div class="history-section">
                <div class="history-title">🕒 最近消費</div>
                <div class="history-list" id="historyList"></div>
            </div>

            <button class="btn btn-danger" onclick="resetTrip()">🛑 結束旅行 (永久刪除數據)</button>
        </div>
    </div>

<script>
    let tripData = { budgetHKD: 0, currency: "JPY", rate: 0, spentHKD: 0, expenses: [] };
    const TOP_CURRENCIES = ["JPY", "TWD", "CNY", "KRW", "THB", "EUR", "GBP", "USD", "AUD", "SGD"];

    window.onload = () => {
        const savedData = localStorage.getItem('myTripBudget');
        if (savedData) {
            tripData = JSON.parse(savedData);
            showMainView();
        } else {
            document.getElementById('setupView').style.display = 'block';
            document.getElementById('mainView').style.display = 'none';
            fetchLiveRate(); // 一入嚟自動幫佢抓取預設(日圓)匯率
        }
    };

    // 抓取即時匯率 API
    function fetchLiveRate() {
        const selectElement = document.getElementById('setupCurrency');
        const customInput = document.getElementById('customCurrency');
        const statusText = document.getElementById('fetchStatus');
        
        let targetCurr = selectElement.value;

        // 處理自訂貨幣
        if (targetCurr === "OTHER") {
            customInput.style.display = 'block';
            targetCurr = customInput.value.toUpperCase().trim();
            if(!targetCurr) return; // 如果未打字，就停低
        } else {
            customInput.style.display = 'none';
        }

        statusText.innerText = "⏳ 獲取中...";
        
        // 使用免費、無需 API Key 嘅穩定匯率 API (基準為 HKD)
        fetch('https://open.er-api.com/v6/latest/HKD')
            .then(response => response.json())
            .then(data => {
                if (data && data.rates && data.rates[targetCurr]) {
                    // 由於 API 提供嘅係 1 HKD = ? 外幣，所以我哋要倒數計算 (1 / 外幣)
                    let rateToHkd = 1 / data.rates[targetCurr];
                    
                    // 根據貨幣大小決定顯示小數點位數
                    let decimalPlaces = rateToHkd < 0.01 ? 5 : 4; 
                    document.getElementById('setupRate').value = rateToHkd.toFixed(decimalPlaces);
                    statusText.innerText = "✅ 即時匯率";
                    statusText.style.color = "#34C759";
                } else {
                    statusText.innerText = "❌ 找不到該貨幣";
                    statusText.style.color = "var(--danger)";
                }
            })
            .catch(error => {
                statusText.innerText = "⚠️ 離線 (請手動輸入)";
                statusText.style.color = "var(--danger)";
            });
    }

    // 進入修改設定
    function editSetup() {
        document.getElementById('setupTitle').innerText = "⚙️ 修改旅行設定";
        document.getElementById('setupBudget').value = tripData.budgetHKD;
        document.getElementById('setupRate').value = tripData.rate;
        
        // 判斷係咪熱門貨幣
        if (TOP_CURRENCIES.includes(tripData.currency)) {
            document.getElementById('setupCurrency').value = tripData.currency;
            document.getElementById('customCurrency').style.display = 'none';
        } else {
            document.getElementById('setupCurrency').value = "OTHER";
            document.getElementById('customCurrency').style.display = 'block';
            document.getElementById('customCurrency').value = tripData.currency;
        }
        
        document.getElementById('fetchStatus').innerText = "🔄 重新抓取";
        document.getElementById('fetchStatus').style.color = "var(--primary)";
        
        document.getElementById('setupView').style.display = 'block';
        document.getElementById('mainView').style.display = 'none';
    }

    // 儲存設定 (新建 / 修改)
    function saveSetup() {
        const budget = parseFloat(document.getElementById('setupBudget').value);
        let currency = document.getElementById('setupCurrency').value;
        if (currency === "OTHER") {
            currency = document.getElementById('customCurrency').value.toUpperCase().trim();
        }
        const rate = parseFloat(document.getElementById('setupRate').value);

        if (!budget || !currency || !rate) {
            alert("請填寫總預算、外幣名稱同匯率！"); return;
        }

        tripData.budgetHKD = budget;
        tripData.currency = currency;
        tripData.rate = rate;
        tripData.spentHKD = 0;
        
        // 修改匯率後，自動幫所有舊記錄重新計港紙！
        tripData.expenses.forEach(item => {
            item.hkd = item.foreign * rate;
            tripData.spentHKD += item.hkd;
        });

        localStorage.setItem('myTripBudget', JSON.stringify(tripData));
        showMainView();
    }

    function showMainView() {
        document.getElementById('setupView').style.display = 'none';
        document.getElementById('mainView').style.display = 'flex';
        document.getElementById('displayCurr').innerText = tripData.currency;
        document.getElementById('displayRate').innerText = tripData.rate;
        document.getElementById('inputCurrLabel').innerText = tripData.currency;
        updateVisuals();
        renderHistory();
    }

    // 新增消費
    function addExpense() {
        let desc = document.getElementById('expenseDesc').value.trim();
        const foreignAmt = parseFloat(document.getElementById('expenseAmount').value);
        if (!foreignAmt || foreignAmt <= 0) return alert("請輸入有效金額！");

        const hkdAmt = foreignAmt * tripData.rate;
        tripData.spentHKD += hkdAmt;
        tripData.expenses.unshift({
            id: Date.now(), desc: desc || "未命名消費",
            foreign: foreignAmt, hkd: hkdAmt, time: new Date().getTime()
        });

        localStorage.setItem('myTripBudget', JSON.stringify(tripData));
        document.getElementById('expenseDesc').value = "";
        document.getElementById('expenseAmount').value = "";
        updateVisuals(); renderHistory();
    }

    // 刪除消費
    function deleteExpense(id) {
        if(confirm("確定要刪除呢筆消費？")) {
            const index = tripData.expenses.findIndex(item => item.id === id);
            if (index !== -1) {
                tripData.spentHKD -= tripData.expenses[index].hkd;
                tripData.expenses.splice(index, 1);
                localStorage.setItem('myTripBudget', JSON.stringify(tripData));
                updateVisuals(); renderHistory();
            }
        }
    }

    function updateVisuals() {
        let remaining = tripData.budgetHKD - tripData.spentHKD;
        let percentage = (remaining / tripData.budgetHKD) * 100;
        if (remaining < 0) remaining = 0; if (percentage < 0) percentage = 0;

        document.getElementById('remainingHKD').innerText = remaining.toFixed(1);
        const waterElement = document.getElementById('waterLevel');
        waterElement.style.height = `${percentage}%`;

        if (percentage <= 20) {
            waterElement.style.background = "linear-gradient(180deg, #ef4444 0%, #991b1b 100%)";
            document.getElementById('budgetPercentage').style.color = "#ef4444";
            document.getElementById('budgetPercentage').innerText = `⚠️ 剩餘 ${percentage.toFixed(1)}%`;
        } else {
            waterElement.style.background = "linear-gradient(180deg, #38bdf8 0%, #0284c7 100%)";
            document.getElementById('budgetPercentage').style.color = "rgba(255,255,255,0.8)";
            document.getElementById('budgetPercentage').innerText = `剩餘 ${percentage.toFixed(1)}%`;
        }
    }

    function renderHistory() {
        const listContainer = document.getElementById('historyList');
        listContainer.innerHTML = '';
        if (tripData.expenses.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:#64748b; font-size:13px; margin-top:20px;">未有消費記錄，盡情享受旅行啦！</div>'; return;
        }

        tripData.expenses.forEach(item => {
            const timeObj = new Date(item.time);
            const timeStr = `${timeObj.getMonth()+1}/${timeObj.getDate()} ${timeObj.getHours().toString().padStart(2, '0')}:${timeObj.getMinutes().toString().padStart(2, '0')}`;
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-info">
                    <div class="history-desc">${item.desc}</div>
                    <div class="history-time">${timeStr}</div>
                </div>
                <div class="history-amounts">
                    <div class="history-foreign">- ${item.foreign} ${tripData.currency}</div>
                    <div class="history-hkd">≈ HK$ ${item.hkd.toFixed(1)}</div>
                </div>
                <button class="delete-btn" onclick="deleteExpense(${item.id})" title="刪除">❌</button>
            `;
            listContainer.appendChild(div);
        });
    }

    function resetTrip() {
        if(confirm("🚨 這將會永久刪除所有記帳紀錄。確定要結束今次旅行？")) {
            localStorage.removeItem('myTripBudget');
            location.reload(); // 直接刷新頁面重置所有狀態
        }
    }
</script>

</body>
</html>
